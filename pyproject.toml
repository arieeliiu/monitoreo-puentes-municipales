[project]
name = "monitoreo-puentes-municipales"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "Pillow==13.0.0",
  "waitress==3.0.2",
  "psycopg[binary]==3.3.6",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python tools/build_vercel_static.py"
